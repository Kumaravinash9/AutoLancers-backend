[project]
name = "automatelancers-backend"
version = "0.1.0"
description = "Freelance auto-bid assistant: discovers Freelancer.com jobs, scores them, drafts proposals."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "cryptography>=43.0",
    "apscheduler>=3.10",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 flags FastAPI's `Depends(...)` in argument defaults, which is the framework's
# intended pattern rather than the mutable-default bug the rule exists to catch.
ignore = ["B008"]
